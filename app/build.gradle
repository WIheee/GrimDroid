plugins {
    // Plugins automatically generated by MLGradleWriter.kt
    alias(libs.plugins.android.application)
    alias(libs.plugins.kotlin.android)
    alias(libs.plugins.kotlin.compose)
    alias(libs.plugins.yumi.licenser)
}

android {
    namespace 'com.grimdroid'
    compileSdk 36
    ndkVersion "30.0.15729638"

    defaultConfig {
        applicationId 'com.grimdroid'
        minSdk 29
        targetSdk 34
        versionCode 1
        versionName '1.0'

        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
            }
        }

        ndk {
            // 只打包这两种 ABI，减少 APK 体积
            abiFilters "arm64-v8a", "x86_64"
        }
    }

    buildFeatures {
        compose true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            // 避免 Termux 环境下 llvm-strip 报错
            keepDebugSymbols += "**/libandroidx.graphics.path.so"
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "4.1.2"
        }
    }
}

// kotlin 块要放在 android 外面
kotlin {
    compilerOptions {
        jvmTarget.set(org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17)
    }
}

dependencies {
    implementation libs.androidx.core.ktx
    implementation libs.androidx.lifecycle.runtime.ktx
    // Service 中挂 ComposeView 所需的 ViewTree owner KTX 扩展
    implementation "androidx.lifecycle:lifecycle-viewmodel-ktx:2.9.2"
    implementation "androidx.savedstate:savedstate-ktx:1.2.1"
    implementation libs.androidx.activity.compose
    implementation platform(libs.androidx.compose.bom)
    implementation libs.androidx.ui
    implementation libs.androidx.ui.graphics
    implementation libs.androidx.ui.tooling.preview
    implementation libs.androidx.material3
    implementation 'com.github.roro2239:Stellar-API:latest.release'
    implementation "androidx.navigation:navigation-compose:2.8.5"
    implementation "androidx.compose.material:material-icons-extended:1.7.8"
    implementation "androidx.work:work-runtime-ktx:2.10.0"
    implementation "androidx.datastore:datastore-preferences:1.1.1"
    debugImplementation libs.androidx.ui.tooling
    debugImplementation libs.androidx.ui.test.manifest
}

// ===== 版权头配置 =====
license {
    // 使用 rule() 方法，而不是 header 属性
    rule(rootProject.file("codeformat/HEADER"))
    include("**/*.kt", "**/*.cpp", "**/*.h", "**/*.hpp")
    exclude("**/build/**")
}

// Yumi Licenser 只从 Java 插件的 sourceSets 收集源码，识别不到 Android 模块。
// Android 的 Kotlin 源码位于 src/**/kotlin（本项目没有 src/main/java），
// 插件默认扫描不到，因此手动为其注册 check/apply 任务。
// 这些任务会被全局的 checkLicenses / applyLicenses 自动聚合。
license.registerTasks("android", fileTree("src") {
    include "**/*.kt"
    include "**/*.cpp"
    include "**/*.h"
    include "**/*.hpp"
})